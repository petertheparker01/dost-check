name: dost-check
 
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
 
permissions:
  contents: write
 
concurrency:
  group: dost-check
  cancel-in-progress: false
 
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FF_UID: ${{ secrets.FF_UID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Requests install
        run: pip install requests
 
      - name: PC on hai ya band
        id: pre
        run: python cloud_check.py precheck
 
      - name: Playwright install
        if: steps.pre.outputs.run == 'yes'
        timeout-minutes: 4
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
 
      - name: Dost ka Last Login check
        if: steps.pre.outputs.run == 'yes'
        timeout-minutes: 4
        run: python cloud_check.py run
 
      - name: State save
        run: |
          git config user.name "dost-bot"
          git config user.email "dost-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "state" && git push)
 
